<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Suspended | Oi Ramen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fafafa;
            --text-main: #111111;
            --text-muted: #737373;
            --accent-gold: #D8942F;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0a0a0a;
                --text-main: #f5f5f5;
                --text-muted: #888888;
                --accent-gold: #D8942F;
            }
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .error-container {
            text-align: center;
            padding: 3rem;
            max-width: 600px;
        }
        .error-code {
            font-family: 'Inter', sans-serif;
            font-size: 5rem;
            line-height: 1;
            color: var(--accent-gold);
            margin-bottom: 1rem;
        }
        .error-title {
            font-family: 'Inter', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: normal;
        }
        .error-message {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }
        .tenant-name {
            color: var(--text-main);
            font-weight: 600;
        }
        .btn-luxury {
            border: 1px solid var(--text-main);
            background: transparent;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0.8rem 2rem;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
            margin-top: 2rem;
        }
        .btn-luxury:hover {
            background: var(--text-main);
            color: var(--bg-color);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">Paused</div>
        <h1 class="error-title">Account Suspended</h1>
        <p class="error-message">
            <span class="tenant-name">{{ tenant.name }}</span>'s Oi Ramen account is currently suspended.
        </p>
        <p class="error-message">
            This usually means there's an issue with billing. Please contact Oi Ramen support to resolve this and restore access.
        </p>
        <a href="{% url 'logout' %}" class="btn-luxury">Sign Out</a>
    </div>
</body>
</html>
